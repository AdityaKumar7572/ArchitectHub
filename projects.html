<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Architect Hub</title>
    <link rel="stylesheet" href="projects.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="#" class="logo">Architect Hub</a>
            <nav>
                <a href="#home">Home</a>
                <a href="#projects">Projects</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <div class="hero">
        <h1>Our Projects</h1>
        <p>Transforming real estate through innovative design and exceptional craftsmanship</p>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterProjects('all')">All Projects</button>
            <button class="filter-btn" onclick="filterProjects('residential')">Residential</button>
            <button class="filter-btn" onclick="filterProjects('commercial')">Commercial</button>
            <button class="filter-btn" onclick="filterProjects('mixed')">Mixed-Use</button>
            <button class="filter-btn" onclick="filterProjects('renovation')">Renovation</button>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Architect Hub. All rights reserved. | Delivering excellence in real estate design</p>
    </footer>

    <script src="projects.js"></script>
</body>
</html>
